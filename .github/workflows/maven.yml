name: Java CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        java: [ 8, 11, 17 ]
    steps:
    - uses: actions/checkout@v2.3.4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: adopt
        java-version: ${{ matrix.java }}
        cache: maven
    - name: Build with Maven on Java ${{ matrix.java }}
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          mvn -V test -Ddoclint=all --file pom.xml --no-transfer-progress -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
        else
          mvn -V test -Ddoclint=all --file pom.xml --no-transfer-progress
        fi
    - name: Package jar on Java ${{ matrix.java }}
      if: matrix.java == 8
      run: mvn -V jar:jar --file pom.xml --no-transfer-progress
    - name: Upload jar
      if: matrix.java == 8
      uses: actions/upload-artifact@v4
      with:
        name: ognl-jar
        path: target/ognl-3.3.4.jar
        if-no-files-found: error
